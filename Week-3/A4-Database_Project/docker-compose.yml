version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: university_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-university_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePass123!}
      POSTGRES_DB: ${POSTGRES_DB:-university_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-university_admin} -d ${POSTGRES_DB:-university_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
